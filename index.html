<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ECHO SIERRA — Location Ops Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { 
    height: 100dvh; width: 100vw; overflow: hidden;
    font-family: 'SF Mono', 'Courier New', monospace;
    background: #000; color: #0f0;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; padding:20px; }
  .screen.active { display:flex; }

  /* Lobby */
  .lobby { align-items:center; justify-content:center; text-align:center; }
  .logo { font-size:11px; letter-spacing:0.3em; color:#0a0; margin-bottom:4px; }
  .title { font-size:36px; font-weight:900; letter-spacing:0.05em; margin-bottom:8px; text-shadow:0 0 20px #0f0; }
  .subtitle { font-size:13px; color:#0a0; margin-bottom:32px; }
  .input {
    background:#0a0a0a; border:1px solid #0a0; color:#0f0; 
    padding:14px 18px; font-size:16px; font-family:inherit; 
    width:100%; max-width:280px; text-align:center; letter-spacing:0.1em;
    margin-bottom:12px; text-transform:uppercase;
  }
  .input::placeholder { color:#030; }
  .btn {
    background:#0f0; color:#000; border:none; padding:16px 40px; 
    font-size:16px; font-weight:900; font-family:inherit; 
    letter-spacing:0.15em; cursor:pointer; text-transform:uppercase;
    transition:0.1s; width:100%; max-width:280px;
  }
  .btn:active { background:#0a0; }
  .btn.danger { background:#300; color:#f44; }
  .btn.ghost { background:transparent; color:#0a0; border:1px solid #0a0; }

  /* Mission screen */
  .mission-header { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
  .mission-name { font-size:11px; color:#0a0; letter-spacing:0.2em; }
  .timer { font-size:24px; font-weight:900; }
  .timer.warn { color:#f80; animation:blink 0.5s infinite; }
  @keyframes blink { 50% { opacity:0.3; } }

  .compass-area { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  .compass-ring {
    width:220px; height:220px; border-radius:50%; 
    border:2px solid #0a0; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .compass-inner {
    width:180px; height:180px; border-radius:50%; 
    border:1px solid #030; position:relative;
  }
  .compass-arrow {
    position:absolute; top:50%; left:50%; 
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-bottom:60px solid #0f0;
    transform: translate(-50%, -100%);
    filter: drop-shadow(0 0 8px #0f0);
    transition: transform 0.3s;
  }
  .compass-n { position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:10px; color:#0a0; }
  .compass-s { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:10px; color:#030; }
  .compass-e { position:absolute; right:8px; top:50%; transform:translateY(-50%); font-size:10px; color:#030; }
  .compass-w { position:absolute; left:8px; top:50%; transform:translateY(-50%); font-size:10px; color:#030; }

  .nav-info { text-align:center; padding:8px 0; }
  .distance { font-size:48px; font-weight:900; line-height:1; }
  .distance-unit { font-size:14px; color:#0a0; }
  .bearing-text { font-size:12px; color:#0a0; margin-top:4px; }
  .waypoint-name { font-size:14px; color:#0f0; margin-top:4px; letter-spacing:0.1em; }

  .mission-footer { display:flex; gap:8px; padding:8px 0; }
  .waypoint-list { display:flex; gap:8px; flex:1; overflow-x:auto; }
  .wp-dot {
    width:32px; height:32px; border-radius:50%; border:1px solid #030;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#030; flex-shrink:0;
  }
  .wp-dot.done { background:#0a0; border-color:#0f0; color:#000; }
  .wp-dot.current { border-color:#0f0; color:#0f0; animation:pulse 1.5s infinite; box-shadow:0 0 10px #0f0; }
  @keyframes pulse { 50% { box-shadow:0 0 20px #0f0, 0 0 30px #0f0; } }

  /* Camera */
  .camera-area { flex:1; display:flex; align-items:center; justify-content:center; background:#000; position:relative; }
  .camera-area video { width:100%; height:100%; object-fit:cover; }
  .camera-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .crosshair { width:60px; height:60px; border:2px solid #0f0; border-radius:50%; opacity:0.5; }
  .camera-capture { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); }
  .capture-btn {
    width:70px; height:70px; border-radius:50%; border:3px solid #0f0;
    background:rgba(0,255,0,0.15); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .capture-btn:active { background:rgba(0,255,0,0.4); }

  /* Complete screen */
  .complete { align-items:center; justify-content:center; text-align:center; }
  .score { font-size:72px; font-weight:900; line-height:1; text-shadow:0 0 30px #0f0; }
  .score-label { font-size:14px; color:#0a0; letter-spacing:0.2em; margin:8px 0 4px; }
  .stats { font-size:13px; color:#0a0; margin:16px 0; line-height:1.8; }
  .photos { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:16px 0; }
  .photos img { width:80px; height:80px; object-fit:cover; border:1px solid #0a0; border-radius:4px; }

  .voice-indicator {
    position:fixed; top:12px; right:12px; 
    width:10px; height:10px; border-radius:50%;
    background:#0f0; opacity:0; transition:0.2s;
    z-index:100;
  }
  .voice-indicator.speaking { opacity:1; animation:pulse 0.3s infinite; }

  .warn-text { color:#f80; font-size:12px; margin-top:8px; }
  .log-line { font-size:10px; color:#030; margin:2px 0; font-family:inherit; }
  .log-area { max-height:60px; overflow-y:auto; margin-top:4px; }
</style>
</head>
<body>

<!-- Voice indicator -->
<div class="voice-indicator" id="voice-dot"></div>

<!-- LOBBY -->
<div class="screen active lobby" id="screen-lobby">
  <div class="logo">▸ TOP SECRET</div>
  <div class="title">ECHO<br>SIERRA</div>
  <div class="subtitle">LOCATION OPERATIONS GAME</div>
  <input class="input" id="team-name" placeholder="TEAM NAME" maxlength="16">
  <button class="btn" onclick="startMission()">DEPLOY TEAM</button>
  <p style="color:#030;font-size:10px;margin-top:20px;letter-spacing:0.1em;">
    HEADPHONES ON. PHONE IN POCKET.<br>MOVE. LISTEN. COMPLETE.
  </p>
  <div id="gps-status" style="color:#300;font-size:10px;margin-top:8px;"></div>
</div>

<!-- MISSION ACTIVE -->
<div class="screen" id="screen-mission">
  <div class="mission-header">
    <div>
      <div class="mission-name" id="mission-label">OP IRON BRIDGE</div>
      <div style="font-size:10px;color:#030;" id="wp-progress">WP 1/4</div>
    </div>
    <div class="timer" id="timer">20:00</div>
  </div>

  <div class="compass-area">
    <div class="compass-ring" id="compass-ring">
      <div class="compass-n">N</div><div class="compass-s">S</div>
      <div class="compass-e">E</div><div class="compass-w">W</div>
      <div class="compass-inner">
        <div class="compass-arrow" id="compass-arrow"></div>
      </div>
    </div>
  </div>

  <div class="nav-info">
    <div><span class="distance" id="distance">--</span><span class="distance-unit">m</span></div>
    <div class="bearing-text" id="bearing-label">ACQUIRING...</div>
    <div class="waypoint-name" id="wp-name"></div>
  </div>

  <div class="mission-footer">
    <div class="waypoint-list" id="wp-list"></div>
    <button class="btn ghost" onclick="takePhoto()" id="photo-btn" style="display:none;max-width:120px;padding:12px;">
      📷 CAPTURE
    </button>
    <button class="btn danger" onclick="abortMission()" style="max-width:80px;padding:8px;font-size:10px;">
      ABORT
    </button>
  </div>

  <div class="log-area" id="log-area"></div>
</div>

<!-- CAMERA SCREEN -->
<div class="screen" id="screen-camera">
  <div class="camera-area" id="camera-view">
    <video id="camera-video" autoplay playsinline></video>
    <div class="camera-overlay"><div class="crosshair"></div></div>
  </div>
  <div class="camera-capture">
    <button class="capture-btn" onclick="capturePhoto()"></button>
  </div>
  <button class="btn ghost" onclick="closeCamera()" style="position:absolute;top:20px;right:20px;max-width:80px;padding:8px;font-size:11px;">
    BACK
  </button>
</div>

<!-- MISSION COMPLETE -->
<div class="screen complete" id="screen-complete">
  <div class="logo">▸ MISSION COMPLETE</div>
  <div class="score-label">FINAL SCORE</div>
  <div class="score" id="final-score">0</div>
  <div class="stats" id="final-stats"></div>
  <div class="photos" id="final-photos"></div>
  <button class="btn" onclick="location.reload()" style="margin-top:16px;">NEW MISSION</button>
</div>

<script>
// ======== STATE ========
let state = {
  teamName: '',
  missionId: '',
  waypoints: [],
  currentWP: 0,
  score: 0,
  startTime: null,
  elapsed: 0,
  photos: [],
  gpsLat: null,
  gpsLng: null,
  heading: 0,
  missionActive: false,
};

// ======== AUDIO NARRATOR ========
const synth = window.speechSynthesis;
let voice = null;

function initVoice() {
  const voices = synth.getVoices();
  // Prefer a deep English voice
  voice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Daniel')) ||
          voices.find(v => v.lang.startsWith('en-GB') && v.name.includes('Male')) ||
          voices.find(v => v.lang.startsWith('en'));
}

function speak(text, rate = 0.9, pitch = 0.8) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = voice;
  u.rate = rate;
  u.pitch = pitch;
  u.volume = 1;
  const dot = document.getElementById('voice-dot');
  dot.classList.add('speaking');
  u.onend = () => dot.classList.remove('speaking');
  synth.speak(u);
}

// ======== GPS ========
let watchId = null;

function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById('gps-status').textContent = 'GPS NOT AVAILABLE';
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    pos => {
      state.gpsLat = pos.coords.latitude;
      state.gpsLng = pos.coords.longitude;
      document.getElementById('gps-status').textContent = 'GPS LOCKED ●';
      document.getElementById('gps-status').style.color = '#0a0';
      if (state.missionActive) updateNavigation();
    },
    err => {
      document.getElementById('gps-status').textContent = 'GPS ERROR: ' + err.message;
      document.getElementById('gps-status').style.color = '#300';
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );
}

// ======== COMPASS ========
function startCompass() {
  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', e => {
      if (e.webkitCompassHeading !== undefined) {
        state.heading = e.webkitCompassHeading; // iOS
      } else if (e.alpha !== null) {
        state.heading = 360 - e.alpha; // Android
      }
      if (state.missionActive) updateNavigation();
    });
    // Request permission for iOS
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  }
}

// ======== WAYPOINT GENERATION ========
function generateWaypoints() {
  if (!state.gpsLat || !state.gpsLng) {
    // Use Appenzell as default if no GPS
    return [
      { name: 'CHECKPOINT ALPHA', lat: 47.33, lng: 9.41, desc: 'Near the town square', points: 100 },
      { name: 'CHECKPOINT BRAVO', lat: 47.331, lng: 9.412, desc: 'By the church', points: 150 },
      { name: 'CHECKPOINT CHARLIE', lat: 47.329, lng: 9.408, desc: 'At the bridge', points: 200 },
      { name: 'EXTRACTION POINT', lat: 47.3305, lng: 9.411, desc: 'Return to base', points: 250 },
    ];
  }
  
  // Generate waypoints around user's position
  const offsets = [
    { dlat: 0.002, dlng: 0.001, name: 'CHECKPOINT ALPHA', desc: '200m northeast' },
    { dlat: -0.001, dlng: 0.002, name: 'CHECKPOINT BRAVO', desc: '150m southeast' },
    { dlat: 0.001, dlng: -0.002, name: 'CHECKPOINT CHARLIE', desc: '250m northwest' },
    { dlat: -0.002, dlng: -0.001, name: 'EXTRACTION POINT', desc: '180m southwest' },
  ];
  
  return offsets.map((o, i) => ({
    name: o.name,
    lat: state.gpsLat + o.dlat,
    lng: state.gpsLng + o.dlng,
    desc: o.desc,
    points: 100 + i * 50
  }));
}

// ======== NAVIGATION ========
function bearing(lat1, lng1, lat2, lng2) {
  const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
  const Δλ = (lng2 - lng1) * Math.PI/180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return ((Math.atan2(y, x) * 180/Math.PI) + 360) % 360;
}

function distance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2 - lat1) * Math.PI/180, Δλ = (lng2 - lng1) * Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateNavigation() {
  if (!state.missionActive || state.currentWP >= state.waypoints.length) return;
  
  const wp = state.waypoints[state.currentWP];
  const dist = distance(state.gpsLat, state.gpsLng, wp.lat, wp.lng);
  const bear = bearing(state.gpsLat, state.gpsLng, wp.lat, wp.lng);
  const relativeBear = ((bear - state.heading) + 360) % 360;
  
  // Update compass arrow
  document.getElementById('compass-arrow').style.transform = 
    `translate(-50%, -100%) rotate(${relativeBear}deg)`;
  document.getElementById('compass-ring').style.transform = 
    `rotate(${-state.heading}deg)`;
  
  // Update distance
  const dEl = document.getElementById('distance');
  if (dist < 30) {
    dEl.textContent = 'ARR';
    dEl.style.color = '#0f0';
  } else if (dist < 1000) {
    dEl.textContent = Math.round(dist);
    dEl.style.color = '#0f0';
  } else {
    dEl.textContent = (dist/1000).toFixed(1);
    document.querySelector('.distance-unit').textContent = 'km';
  }
  
  // Bearing label
  let dir = '';
  if (relativeBear < 22.5 || relativeBear > 337.5) dir = 'STRAIGHT AHEAD';
  else if (relativeBear < 67.5) dir = 'SLIGHT RIGHT';
  else if (relativeBear < 112.5) dir = 'RIGHT';
  else if (relativeBear < 157.5) dir = 'HARD RIGHT';
  else if (relativeBear < 202.5) dir = 'BEHIND YOU';
  else if (relativeBear < 247.5) dir = 'HARD LEFT';
  else if (relativeBear < 292.5) dir = 'LEFT';
  else dir = 'SLIGHT LEFT';
  
  document.getElementById('bearing-label').textContent = dir;
  document.getElementById('wp-name').textContent = wp.name;
  
  // Arrival check
  if (dist < 30 && !document.getElementById('photo-btn').style.display.includes('block')) {
    document.getElementById('photo-btn').style.display = 'block';
    speak('Target acquired. Take the photo, soldier.', 1.0, 0.7);
  }
}

// ======== MISSION CONTROL ========
function startMission() {
  const name = document.getElementById('team-name').value.trim() || 'GHOST';
  state.teamName = name;
  state.missionId = 'OP-' + Math.random().toString(36).slice(2,6).toUpperCase();
  state.waypoints = generateWaypoints();
  state.currentWP = 0;
  state.score = 0;
  state.photos = [];
  state.startTime = Date.now();
  state.missionActive = true;
  
  document.getElementById('mission-label').textContent = state.missionId;
  document.getElementById('wp-name').textContent = state.waypoints[0].name;
  document.getElementById('wp-progress').textContent = `WP 1/${state.waypoints.length}`;
  document.getElementById('timer').textContent = '20:00';
  document.getElementById('timer').classList.remove('warn');
  document.getElementById('photo-btn').style.display = 'none';
  document.getElementById('log-area').innerHTML = '';
  
  // Render waypoint dots
  const wpList = document.getElementById('wp-list');
  wpList.innerHTML = state.waypoints.map((_, i) => 
    `<div class="wp-dot ${i===0?'current':''}" id="wp-dot-${i}">${i+1}</div>`
  ).join('');
  
  switchScreen('screen-mission');
  
  // Start timer
  timerInterval = setInterval(updateTimer, 1000);
  
  // Initial briefing
  setTimeout(() => {
    speak(`Team ${state.teamName}. Mission ${state.missionId}. ${state.waypoints.length} waypoints. Move to ${state.waypoints[0].name}. Go.`, 0.95, 0.75);
  }, 500);
  
  // Navigation update loop
  navInterval = setInterval(() => {
    if (state.missionActive) {
      updateNavigation();
      // Audio nav cues every 15 seconds
      const wp = state.waypoints[state.currentWP];
      const dist = distance(state.gpsLat, state.gpsLng, wp.lat, wp.lng);
      if (dist > 50) {
        const bear = bearing(state.gpsLat, state.gpsLng, wp.lat, wp.lng);
        const rel = ((bear - state.heading) + 360) % 360;
        let dir = rel < 180 ? 'right' : 'left';
        if (rel < 45 || rel > 315) dir = 'ahead';
        if (dist < 100) speak(`${Math.round(dist)} meters, ${dir}.`, 1.2, 0.8);
      }
    }
  }, 15000);
}

let timerInterval = null;
let navInterval = null;

function updateTimer() {
  if (!state.missionActive) return;
  const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  const remaining = Math.max(0, 1200 - elapsed); // 20 min
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const tEl = document.getElementById('timer');
  tEl.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
  if (remaining < 300) tEl.classList.add('warn');
  if (remaining <= 0) endMission(false);
  state.elapsed = elapsed;
}

function takePhoto() {
  switchScreen('screen-camera');
  const video = document.getElementById('camera-video');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => { video.srcObject = stream; })
    .catch(() => {
      // Fallback: use file input
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.onchange = e => {
        const file = e.target.files[0];
        if (file) processPhoto(URL.createObjectURL(file));
      };
      input.click();
    });
}

function capturePhoto() {
  const video = document.getElementById('camera-video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  
  // Stop camera
  const stream = video.srcObject;
  if (stream) stream.getTracks().forEach(t => t.stop());
  
  processPhoto(dataUrl);
}

function processPhoto(dataUrl) {
  const wp = state.waypoints[state.currentWP];
  const dist = distance(state.gpsLat, state.gpsLng, wp.lat, wp.lng);
  
  if (dist < 50) {
    // Verified!
    state.score += wp.points + Math.max(0, 100 - Math.round(dist));
    state.photos.push(dataUrl);
    
    // Log
    const log = document.getElementById('log-area');
    log.innerHTML += `<div class="log-line">▸ ${wp.name} CAPTURED +${wp.points}pts</div>`;
    
    // Mark waypoint done
    document.getElementById(`wp-dot-${state.currentWP}`).classList.add('done');
    document.getElementById(`wp-dot-${state.currentWP}`).classList.remove('current');
    
    state.currentWP++;
    
    if (state.currentWP >= state.waypoints.length) {
      endMission(true);
    } else {
      // Next waypoint
      document.getElementById(`wp-dot-${state.currentWP}`).classList.add('current');
      document.getElementById('wp-progress').textContent = `WP ${state.currentWP+1}/${state.waypoints.length}`;
      document.getElementById('photo-btn').style.display = 'none';
      const next = state.waypoints[state.currentWP];
      speak(`Good work. Next target: ${next.name}. ${next.desc}. Move.`, 0.95, 0.75);
    }
  } else {
    speak('Too far from target. Get closer.', 1.1, 0.8);
  }
  
  switchScreen('screen-mission');
}

function closeCamera() {
  const video = document.getElementById('camera-video');
  const stream = video.srcObject;
  if (stream) stream.getTracks().forEach(t => t.stop());
  switchScreen('screen-mission');
}

function abortMission() {
  if (confirm('ABORT MISSION?')) {
    speak('Mission aborted. Return to base.', 1.0, 0.7);
    endMission(false);
  }
}

function endMission(success) {
  state.missionActive = false;
  clearInterval(timerInterval);
  clearInterval(navInterval);
  synth.cancel();
  
  const finalScore = success ? state.score + Math.max(0, 500 - state.elapsed) : Math.round(state.score * 0.5);
  
  document.getElementById('final-score').textContent = finalScore;
  document.getElementById('final-stats').innerHTML = `
    TEAM: ${state.teamName}<br>
    MISSION: ${state.missionId}<br>
    WAYPOINTS: ${state.currentWP}/${state.waypoints.length}<br>
    TIME: ${Math.floor(state.elapsed/60)}m ${state.elapsed%60}s<br>
    STATUS: ${success ? 'COMPLETED' : 'ABORTED'}
  `;
  document.getElementById('final-photos').innerHTML = state.photos.map(p => 
    `<img src="${p}">`
  ).join('');
  
  switchScreen('screen-complete');
  
  if (success) {
    speak(`Mission complete. Team ${state.teamName}. Final score: ${finalScore}. Outstanding.`, 0.9, 0.7);
  }
}

// ======== SCREEN SWITCHING ========
function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ======== INIT ========
initVoice();
startGPS();
startCompass();

// Handle voice init on mobile
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = initVoice;
}
</script>
</body>
</html>
